<section id="quienes" data-section tabindex="-1" aria-labelledby="about-title" class="about-section section">
  <div class="container">
    <lm-section-bar [section]="content" />
    <div class="about-headline"><span class="kicker">{{ content.kicker }}</span><h2 id="about-title">{{ content.title }}</h2></div>
    <div class="about-editorial">
      <figure class="about-visual">
        <div class="about-photo"><img src="assets/service-station-sign.jpg" alt="Fachada azul con el letrero LIQUI MOLY Service Station" width="5184" height="3456" loading="lazy"><div class="photo-corner" aria-hidden="true"></div></div>
        <figcaption class="about-photo-caption"><span aria-hidden="true"></span><div><strong>Una marca que se reconoce</strong><small>LIQUI MOLY SERVICE STATION</small></div></figcaption>
      </figure>
      <div class="about-copy"><div class="pillars">@for (pillar of content.pillars; track pillar.title; let i = $index) { <div class="pillar">@if (i === 1) { <img class="quality-commitment-seal" src="assets/quality-commitment-seal.png" alt="Sello Calidad, nuestro compromiso" width="108" height="108" loading="lazy"> }<h3>{{ pillar.title }}</h3><p>{{ pillar.description }}</p></div> }</div>
      </div>
    </div>
    @if (video) {
      <figure class="about-video" aria-label="Video comercial de LIQUI MOLY Service Station">
        <video controls playsinline preload="metadata" poster="assets/video-commercial-poster.png" aria-label="Video comercial de LIQUI MOLY Service Station">
          <source src="assets/liqui-moly-service-station-commercial.mp4" type="video/mp4">
          Tu navegador no puede reproducir este video.
        </video>
      </figure>
    }
  </div>
</section>
